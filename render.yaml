services:
  - type: web
    name: mk9-tarefas
    runtime: node
    plan: 0.5c-512mb
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: REGISTRATION_CODE
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        sync: false
    disk:
      name: mk9-data
      mountPath: /var/data
      sizeGB: 5
